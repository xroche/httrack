# Windows build of the engine (VS2022 v143 + vcpkg): libhttrack, the CLI,
# webhttrack, proxytrack.
#
# This is our only MSVC coverage. The WinHTTrack GUI links libhttrack.dll.
name: windows-build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The suite watchdog reports as a commit status, the only channel that
  # outlives the runner it is reporting on (#795).
  statuses: write

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libhttrack:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32, ARM64]
        configuration: [Release]
    # No repo-wide cap (#1228). Test 226 sizes the step timeouts against the
    # suite watchdog.
    # Redirect vcpkg's `files` binary cache into the workspace so actions/cache
    # can persist it. Otherwise vcpkg builds openssl/brotli/zlib/zstd from
    # source, several minutes every run.
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
      # The platform as dumpbin and the VS dev shell name it.
      MACHINE: ${{ matrix.platform == 'Win32' && 'x86' || matrix.platform }}
      # No hosted x64 runner can execute an ARM64 binary.
      RUNNABLE: ${{ matrix.platform != 'ARM64' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # coucal lives in src/coucal
          # Or the job token stays in .git/config, where every test the suite
          # runs can read it.
          persist-credentials: false

      # Located through vswhere rather than microsoft/setup-msbuild: the repo
      # only allows GitHub-owned actions.
      - name: Find MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          Write-Host "MSBuild: $msbuild"
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        run: vcpkg integrate install

      # vcpkg errors if VCPKG_DEFAULT_BINARY_CACHE points at a missing dir, and
      # actions/cache does not create it on a miss.
      - name: Create the vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      # vcpkg-tool #1662 dropped x-gha, so cache the binary archives directly.
      # An exact key hit skips the save, and a key listing vcpkg's ABI inputs
      # can miss one. Key on the run id instead, and restore by prefix.
      - name: Restore the vcpkg binary archives
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('src/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-${{ hashFiles('src/vcpkg.json') }}-
            vcpkg-${{ matrix.platform }}-

      # Counted before the build, or vcpkg's own writes during it make a cold cache
      # look warm.
      - name: Count the restored vcpkg archives
        shell: pwsh
        run: |
          $a = @(Get-ChildItem -Recurse -File -Filter *.zip `
            $env:VCPKG_DEFAULT_BINARY_CACHE -EA SilentlyContinue)
          Write-Host "restored $($a.Count) archive(s)"
          $a.FullName | Out-File -FilePath vcpkg-restored.txt
          "VCPKG_ARCHIVES_BEFORE=$($a.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The runner image's vcpkg checkout is older than our builtin-baseline, and
      # vcpkg reads the version database from its working tree, so fetch the
      # baseline (read from the manifest) and check out its versions/ too.
      - name: Fetch the pinned vcpkg baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $baseline = (Get-Content src/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) { throw "no builtin-baseline in src/vcpkg.json" }
          git -C $root fetch --no-tags origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "could not fetch vcpkg baseline $baseline" }
          git -C $root checkout $baseline -- versions
          if ($LASTEXITCODE -ne 0) { throw "could not check out versions/ at $baseline" }

      # httrack and webhttrack carry a ProjectReference to libhttrack, so building
      # them builds it first; proxytrack is standalone.
      - name: Build
        shell: pwsh
        run: |
          foreach ($proj in @("libhttrack", "httrack", "webhttrack", "proxytrack")) {
            & $env:MSBUILD "src\$proj.vcxproj" `
              /m `
              /p:Configuration=${{ matrix.configuration }} `
              /p:Platform=${{ matrix.platform }} `
              /p:VcpkgEnableManifest=true `
              /flp:LogFile=msbuild-$proj.log`;Verbosity=normal
            if ($LASTEXITCODE -ne 0) { throw "$proj failed" }
          }

      # A stale cache and a warm one both restore and rebuild; only archives
      # restored and unmatched prove staleness.
      - name: Check whether vcpkg could use the restored archives
        id: vcpkg
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $before = [int]$env:VCPKG_ARCHIVES_BEFORE
          $stale = $false
          # The log is missing when the build never reached MSBuild.
          if (Test-Path msbuild-libhttrack.log) {
            $m = Select-String -Path msbuild-libhttrack.log -Pattern 'Restored (\d+) package' |
              Select-Object -First 1
            if ($m) {
              $restored = [int]$m.Matches[0].Groups[1].Value
              Write-Host "vcpkg restored $restored of $before archive(s)"
              $stale = ($restored -eq 0 -and $before -gt 0)
            } else { Write-Host "no vcpkg restore line in the build log" }
          } else { Write-Host "no build log" }
          if ($stale) {
            Write-Host "::warning::stale vcpkg cache: $before archives, none matching this toolchain; every port rebuilt from source"
            # These can never match again, so drop them. Use -LiteralPath,
            # because a piped string binds -Path, which globs on a [ ] name.
            Get-Content vcpkg-restored.txt -EA SilentlyContinue | Where-Object { $_ } |
              ForEach-Object { Remove-Item -LiteralPath $_ -Force -EA SilentlyContinue }
          }
          $after = @(Get-ChildItem -Recurse -File -Filter *.zip `
            $env:VCPKG_DEFAULT_BINARY_CACHE -EA SilentlyContinue).Count
          Write-Host "$after archive(s) to cache"
          # The stale case saves on its own, because pruning can replace
          # every archive without moving the count.
          "save=$($stale -or ($after -gt $before))".ToLower() |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Only when the archive set changed, so a warm run adds no entry and the
      # eviction budget stays for the runs that rebuilt something.
      - name: Save the vcpkg binary archives
        if: ${{ !cancelled() && steps.vcpkg.outputs.save == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('src/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # WinHTTrack links src\$(Platform)\$(Configuration)\libhttrack.lib, so the
      # import lib and the DLL both have to land there under that exact name.
      - name: Check the binaries landed where they are expected
        shell: pwsh
        run: |
          $dir = "src\${{ matrix.platform }}\${{ matrix.configuration }}"
          $want = @("libhttrack.dll", "libhttrack.lib", "httrack.exe",
                    "webhttrack.exe", "proxytrack.exe")
          foreach ($f in $want) {
            if (-not (Test-Path "$dir\$f")) { throw "missing $dir\$f" }
            Write-Host "found $dir\$f"
          }

      # A CRT split across the exe/DLL boundary links fine and crashes on the
      # first cross-heap free, so assert both sides import the *same* vcruntime.
      # Also assert the machine type: Test-Path alone would accept an x64 binary
      # sitting in the Win32 output dir.
      - name: Check the CRT is shared across the boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "src\${{ matrix.platform }}\${{ matrix.configuration }}"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -find VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          $wantMachine = $env:MACHINE

          function Get-Crt($path) {
            $out = & $dumpbin /dependents /headers $path
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $path" }
            ,@($out | Select-String -Pattern '^\s*(vcruntime\d+d?\.dll)$' |
               ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() })
          }

          # Negative control: cmd.exe links the old msvcrt, not vcruntime140. If
          # this came back non-empty the detector would match anything, and the
          # assertion below would pass on a mismatched CRT too.
          if ((Get-Crt "$env:SystemRoot\System32\cmd.exe").Count -ne 0) {
            throw "negative control failed: the vcruntime detector matches anything"
          }

          $crts = @{}
          foreach ($f in @("libhttrack.dll", "httrack.exe")) {
            $crt = Get-Crt "$dir\$f"
            if ($crt.Count -eq 0) { throw "$f imports no vcruntime: static or mismatched CRT" }
            $crts[$f] = $crt

            $hdr = & $dumpbin /headers "$dir\$f"
            if (-not ($hdr | Select-String -SimpleMatch "machine ($wantMachine)")) {
              throw "$f is not $wantMachine"
            }
            Write-Host "$f -> $($crt -join ',') ($wantMachine)"
          }

          $a = $crts["libhttrack.dll"] | Sort-Object
          $b = $crts["httrack.exe"] | Sort-Object
          if (Compare-Object $a $b) {
            throw "CRT mismatch across the boundary: libhttrack.dll=$a httrack.exe=$b"
          }

      # A property dropped from a .vcxproj still builds, so assert the
      # mitigations where they end up.
      - name: Check the hardening flags reached the binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "src\${{ matrix.platform }}\${{ matrix.configuration }}"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -find VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }

          # /headers holds the DLL-characteristics bits, /loadconfig carries CET.
          function Get-Headers($path) {
            $out = & $dumpbin /headers /loadconfig $path
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $path" }
            $out -join "`n"
          }

          # Maps each mitigation to its pattern in that dump.
          $want = [ordered]@{
            "ASLR (/DYNAMICBASE)"        = "Dynamic base"
            "DEP (/NXCOMPAT)"            = "NX compatible"
            "Control Flow Guard"         = "Control Flow Guard"
          }
          if ("${{ matrix.platform }}" -eq "x64") {
            $want["Shadow stacks (/CETCOMPAT)"] = "CET\s*Compat"
          }

          # These are what a dump does not show. /GS is counted, because the
          # CRT links __security_cookie into every image whatever /GS was. The
          # VC feature record counts the objects compiled with it.
          function Missing($hdr) {
            $out = @()
            foreach ($k in $want.Keys) {
              if ($hdr -notmatch $want[$k]) { $out += $k }
            }
            $cc = if ($hdr -match "C/C\+\+=(\d+)") { [int]$Matches[1] } else { -1 }
            $gs = if ($hdr -match ",\s*/GS=(\d+)") { [int]$Matches[1] } else { -1 }
            if ($cc -le 0) { $out += "a VC feature record, so /GS cannot be read" }
            elseif ($gs -lt $cc) { $out += "/GS on $($cc - $gs) of $cc objects" }
            ,$out
          }

          # A dump with ASLR and a security cookie but no guard and no /GS
          # count must report the rest missing, so each row is shown to fail.
          $none = "Dynamic base`nSecurity Cookie 0x140001000`n" +
                  "Counts: Pre-VC++ 11.00=0, C/C++=73, /GS=0, /sdl=0"
          $ctl = Missing $none
          $mustReport = @("DEP (/NXCOMPAT)", "Control Flow Guard")
          if ("${{ matrix.platform }}" -eq "x64") { $mustReport += "Shadow stacks (/CETCOMPAT)" }
          foreach ($k in $mustReport) {
            if ($ctl -notcontains $k) { throw "negative control: $k was not reported missing" }
          }
          if (-not ($ctl -like "*/GS on 73 of 73*")) {
            throw "negative control: /GS was not reported missing (got: $($ctl -join ', '))"
          }

          $bad = 0
          foreach ($f in @("libhttrack.dll", "httrack.exe", "webhttrack.exe", "proxytrack.exe")) {
            $gap = Missing (Get-Headers "$dir\$f")
            if ($gap.Count -gt 0) {
              Write-Host "::error::${f} is missing $($gap -join '; ')"
              $bad++
            } else {
              Write-Host "${f}: every mitigation present"
            }
          }
          if ($bad -gt 0) { throw "$bad binary/binaries missing a mitigation" }

      # The DLL build only proves the engine's own fixed include order, the one
      # order a consumer need not use, and 205/206/207/269 all gate on an automake
      # environment this job has not (#1153).
      - name: Compile the installed headers standalone and pairwise
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "Visual Studio not found" }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          $arch = $env:MACHINE.ToLower()
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments "-arch=$arch -host_arch=x64"
          # htsbasenet.h reaches for <openssl/ssl.h> unless a consumer turns it
          # off, so the sweep needs what vcpkg installed for the build. Searched,
          # not spelled: the install root nests the triplet twice.
          $dirs = @(Get-ChildItem -Path "src\vcpkg_installed" -Recurse -Depth 3 `
                      -Directory -Filter include -ErrorAction SilentlyContinue)
          if (-not ($dirs | Where-Object { Test-Path (Join-Path $_.FullName "openssl\ssl.h") })) {
            throw "no vcpkg include directory under src\vcpkg_installed holds openssl/ssl.h"
          }
          $inc = @($dirs | ForEach-Object { "-I" + $_.FullName })
          bash tests/install-headers-sweep.sh --backend cl --srcdir . -- @inc
          if ($LASTEXITCODE -ne 0) { throw "the installed headers do not compile standalone and pairwise" }

      - name: Restore the WSL rootfs
        if: env.RUNNABLE == 'true'
        id: wslrootfs
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\wsl-rootfs.tar.gz
          key: wsl-rootfs-jammy-amd64-v1

      # WSL2 comes up in ~35s, because the image already enables its three
      # features. It runs a real Linux shell against the same native
      # httrack.exe. Do not bring back an MSYS leg, because its fork
      # emulation wedged (#1273) and runner deaths fell from 12.5% to 0.3%
      # without it (#1228).
      - name: Bring up WSL2
        id: wslup
        if: env.RUNNABLE == 'true'
        # Non-gating, because a failed import reaches the suite step, which
        # names it and reds there.
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 15
        run: |
          # Three tries, because this endpoint 403s per runner VM and waiting
          # longer cannot help. A later step stops the leg when all three fail.
          $updated = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              wsl --update
              if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE" }
              $updated = $true
              break
            }
            catch {
              Write-Host "wsl --update attempt $i failed: $($_.Exception.Message)"
              if ($i -lt 3) { Start-Sleep -Seconds (5 * $i) }
            }
          }
          "updated=$($updated.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          wsl --set-default-version 2
          # The Stop step reads this, so a leg whose import worked still runs.
          $imported = $false
          try {
            $root = "$env:RUNNER_TEMP\wsl-rootfs.tar.gz"
            # jammy, not noble: the noble rootfs asset 404s as of 2026-09. The
            # jammy asset is named after its release, not "wsl.rootfs".
            # Cached above, because this host has answered 403 on a good URL and
            # a whole leg then rests on one third-party request. Three tries with
            # a pause, so a transient does not cost the round either.
            if (Test-Path $root) {
              Write-Host "rootfs restored from cache, $((Get-Item $root).Length) bytes"
            } else {
              $url = "https://cloud-images.ubuntu.com/wsl/jammy/current/ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz"
              for ($i = 1; $i -le 3; $i++) {
                try { Invoke-WebRequest -UseBasicParsing -OutFile $root $url; break }
                catch {
                  Write-Host "rootfs download attempt $i failed: $($_.Exception.Message)"
                  if ($i -eq 3) { throw }
                  Start-Sleep -Seconds (5 * $i)
                }
              }
            }
            wsl --import httrack-suite "$env:RUNNER_TEMP\wsl-distro" $root --version 2
            if ($LASTEXITCODE -ne 0) { throw "wsl --import failed" }
            # A distro that answers is the only proof the import is usable.
            wsl -d httrack-suite -- uname -a
            if ($LASTEXITCODE -ne 0) { throw "the imported distro does not run" }
            $imported = $true
          } finally {
            "imported=$($imported.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          }
          # For the record when a path stops converting: this rootfs has no
          # wslpath, which is why nothing in the suite calls one.
          wsl -d httrack-suite -- sh -c 'command -v wslpath || echo "no wslpath"'
          # Logs the automount, /mnt/c and /mnt/d included, for path errors.
          wsl -d httrack-suite -- sh -c 'echo mounts:; ls -d /mnt/*'

      - name: Save the WSL rootfs
        if: env.RUNNABLE == 'true' && steps.wslrootfs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\wsl-rootfs.tar.gz
          key: wsl-rootfs-jammy-amd64-v1

      # Do not restore the cached kernel package: it never passed the suite (#1656).
      - name: Stop when wsl --update failed
        if: steps.wslup.outputs.updated == 'false' && steps.wslup.outputs.imported != 'true'
        shell: bash
        run: |
          echo "::error::wsl --update failed and the distro did not import: re-run this leg"
          exit 1

      - name: Run the engine test suite (offline tests, WSL2)
        if: env.RUNNABLE == 'true'
        shell: bash
        working-directory: tests
        # 226_watchdog-native.test enforces this: the suite's own 1500s deadline
        # plus the watchdog's 900s does not fit in less.
        timeout-minutes: 45
        env:
          # One worker per vCPU on the hosted runner.
          HTTRACK_SUITE_JOBS: 4
          WATCHDOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_REPO: ${{ github.repository }}
          WATCHDOG_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WATCHDOG_CONTEXT: windows-suite-wsl2 (${{ matrix.platform }}, ${{ matrix.configuration }})
          WATCHDOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Git Bash rewrites anything shaped like a POSIX path on its way to a
          # native exe, and wsl.exe is one: /mnt/d/... reached the distro as
          # "C:/Program Files/Git/mnt/d/...". The driver sets these for the same
          # reason on its own side.
          export MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*'
          # /p translates a value as a path on the way in; RUNNER_TEMP goes over
          # untranslated, since the driver takes the Windows form and converts it
          # itself for the two views it needs.
          export WSLENV='HTTRACK_SUITE_BACKEND:HTTRACK_SUITE_JOBS:RUNNER_TEMP:WATCHDOG_TOKEN:WATCHDOG_REPO:WATCHDOG_SHA:WATCHDOG_CONTEXT:WATCHDOG_URL:GITHUB_STEP_SUMMARY/p:HTS_WS:HTS_BIN'
          export HTTRACK_SUITE_BACKEND=wsl2
          # Mapped here rather than by wslpath, which a bare imported rootfs
          # does not ship: `wsl -- wslpath` answers ERROR_PATH_NOT_FOUND. MSYS
          # gives /d/a/..., and drvfs mounts the same volume at /mnt/d/a/...
          ws=/mnt$(cygpath -u "$GITHUB_WORKSPACE")
          case "$ws" in
          /mnt/[a-z]/*) ;;
          *)
            echo "::error::the workspace did not convert to a drvfs path: $ws"
            exit 1
            ;;
          esac
          # Pass the path in the environment, because
          # `wsl -- sh -c '...' _ "$ws"` delivers an empty $1. WSLENV already
          # carries everything else.
          # The bring-up is continue-on-error, so a failed import arrives here as
          # "There is no distribution with the supplied name" and exit 127.
          # wsl -l writes UTF-16. Capture it, because grep -q exits on the
          # match, tr takes SIGPIPE, and pipefail would red a present distro.
          distros=$(wsl -l -q | tr -d '\0\r')
          grep -qx httrack-suite <<<"$distros" || {
            # One annotation is one line: a newline would drop all but the first.
            seen=${distros//$'\n'/ }
            echo "::error::no httrack-suite distro (wsl -l -q gave: ${seen:-(none)}): the Bring up WSL2 step did not finish"
            exit 1
          }
          export HTS_WS="$ws"
          export HTS_BIN="$ws/src/${{ matrix.platform }}/${{ matrix.configuration }}"
          # shellcheck disable=SC2016 # exported above for the inner sh to expand
          wsl -d httrack-suite -- sh -c 'echo "ws=[$HTS_WS] bin=[$HTS_BIN]"; test -d "$HTS_WS/tests" || { echo "::error::$HTS_WS/tests is not visible in the distro"; exit 1; }'
          # shellcheck disable=SC2016 # same: the distro's shell expands these
          wsl -d httrack-suite -- sh -c 'cd "$HTS_WS/tests" && exec bash ./ci-windows-suite.sh "$HTS_BIN"' 2>&1 | tee suite-console-wsl2.log

      # A separate step, because the watchdog can kill the suite's step before
      # it counts, when the count matters most (#1588).
      - name: Count the workers the suite lost
        if: always() && env.RUNNABLE == 'true'
        shell: bash
        working-directory: tests
        run: |
          . ./ci-windows-suite.sh
          ci_report_lost_workers suite-console-wsl2.log

      # "make check" is Linux/macOS only, so these run the offline tests against
      # the native httrack.exe. The *_local-* ones crawl the bundled Python
      # server over loopback, our only Windows test of TLS, cache and writer.
      - name: Upload the test logs
        if: always() && env.RUNNABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: engine-tests-${{ matrix.platform }}-${{ matrix.configuration }}
          path: tests/*.log
          if-no-files-found: warn

      - name: Upload MSBuild logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-${{ matrix.platform }}-${{ matrix.configuration }}
          path: msbuild-*.log
          if-no-files-found: ignore

  # 496_ci-tier2-split.test fails when a job above is missing from needs: below.
  gate:
    name: windows gate
    if: always()
    needs:
      - libhttrack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/gate
        with:
          needs: ${{ toJSON(needs) }}
