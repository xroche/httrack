# Build and test on x86-64 and arm64, and lint the shell scripts.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }}, ${{ matrix.cc }}${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # cflags is spelled out everywhere: an exported empty CFLAGS reads as
        # "set" to configure, which then drops its own -g -O2.
        include:
          - { arch: x86-64, runner: ubuntu-24.04, cc: gcc, cflags: -g -O2 }
          - { arch: x86-64, runner: ubuntu-24.04, cc: clang, cflags: -g -O2 }
          - { arch: arm64, runner: ubuntu-24.04-arm, cc: gcc, cflags: -g -O2 }
          - { arch: arm64, runner: ubuntu-24.04-arm, cc: clang, cflags: -g -O2 }
          # Ubuntu builds httrack this way; no other leg here does.
          - {
              arch: x86-64,
              runner: ubuntu-24.04,
              cc: gcc,
              label: " -O3 -flto",
              cflags: -g -O3 -flto=auto -ffat-lto-objects,
            }
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: ${{ matrix.cflags }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential clang autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev \
            appstream appstream-util

      - name: Configure
        run: |
          set -euo pipefail
          # Regenerate: configure and the Makefile.in's are not tracked.
          autoreconf -fi
          # Disabling zlib must fail here rather than at link with a pile of
          # undefined minizip references (#735). Both spellings, so a rewrite
          # cannot keep one and lose the other. Probed out-of-tree to leave
          # nothing behind.
          nozlib="$RUNNER_TEMP/nozlib"
          for arg in --without-zlib --with-zlib=no; do
            rm -rf "$nozlib" && mkdir -p "$nozlib"
            if (cd "$nozlib" && "$GITHUB_WORKSPACE/configure" "$arg" >out.log 2>&1); then
              echo "::error::configure $arg succeeded; it must be rejected"
              exit 1
            fi
            # ... and for the stated reason, not an unrelated configure failure.
            grep -q "zlib cannot be disabled" "$nozlib/out.log" \
              || { cat "$nozlib/out.log"; exit 1; }
          done
          ./configure
          # Same dead end from the compile side. The bare compile is the
          # control: without it a broken probe would pass vacuously.
          hdr='#include "htsglobal.h"'
          echo "$hdr" | $CC -I. -Isrc -fsyntax-only -xc -
          if echo "$hdr" | $CC -DHTS_USEZLIB=0 -I. -Isrc -fsyntax-only -xc - 2>/dev/null; then
            echo "::error::-DHTS_USEZLIB=0 compiled; htsglobal.h must reject it"
            exit 1
          fi
          # a missing decoder would silently drop the coding from Accept-Encoding
          grep -q "define HTS_USEBROTLI 1" config.h
          grep -q "define HTS_USEZSTD 1" config.h
          # losing either would make every crash test skip, and the suite stay green
          grep -q "define HAVE_BACKTRACE 1" config.h
          grep -q "define HAVE_SPAWN_H 1" config.h

      - name: Build
        run: make -j"$(nproc)"

      # FTP_PASV is 1 in every build, so #if !FTP_PASV never reaches a compiler
      # and rots unnoticed (#1091). Compiling is all this proves; nothing runs it.
      - name: Compile the FTP active-mode branch
        run: |
          set -euo pipefail
          objs="src/libhttrack_la-htsftp.lo src/libhttrack_la-htsftp.o src/.libs/libhttrack_la-htsftp.o"
          # accept() marks active-mode code: absent from the object Build made,
          # present below. One-sided, it passes on a file that ignored the define.
          syms=$(nm --undefined-only src/.libs/libhttrack_la-htsftp.o)
          if grep -qw accept <<<"$syms"; then
            echo "::error::accept() is reachable with FTP_PASV=1; the marker no longer discriminates"
            exit 1
          fi
          rm -f $objs
          # Through CC: overriding CPPFLAGS would drop configure's
          # -D_FORTIFY_SOURCE and the object-size warnings that come with it.
          make -C src libhttrack_la-htsftp.lo CC="$CC -DFTP_PASV=0 -Werror"
          syms=$(nm --undefined-only src/.libs/libhttrack_la-htsftp.o)
          grep -qw accept <<<"$syms" || { echo "::error::-DFTP_PASV=0 built no active-mode code"; exit 1; }
          rm -f $objs

      # A backstop only: tests/test-timeout.sh bounds each test, and a healthy run
      # is a minute here, two on macOS. Without it a stall ran to the job's 6h default.
      - name: Test
        timeout-minutes: 20
        run: |
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

  # Reproduce the Debian buildds: they build in a minimal chroot with no
  # python3, so the local-server tests must SKIP (exit 77), not fail. GitHub
  # runners ship python3, so every other job hides this path; here we remove it
  # before `make check`. This is the guard that would have caught the 3.49.10-1
  # FTBFS (28_local-pause failed instead of skipping when python3 was absent).
  buildd-no-python3:
    name: build (no python3, Debian buildd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - name: Configure
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure

      - name: Build
        run: make -j"$(nproc)"

      - name: Test without python3
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Hide every python3* so `command -v python3` fails like it does in the
          # buildd chroot; masking with /bin/false would still resolve.
          sudo find /usr/bin /usr/local/bin -maxdepth 1 -name 'python3*' \
            -exec mv {} {}.hidden \;
          ! command -v python3
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

  # Two networks no runner has: buildds that refuse TEST-NET-1 rather than drop
  # it (#1108), and an rpm buildroot, where a UDP connect names no source at all
  # and #1463 read that wildcard as an address. One job, since the build is the
  # same and neither check is worth a second three-minute compile.
  hostile-network:
    name: build (constrained networks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev iproute2

      - name: Configure
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure

      - name: Build
        run: make -j"$(nproc)"

      - name: Test on a network that refuses TEST-NET-1
        timeout-minutes: 20
        run: |
          set -euo pipefail
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          tools/hostile-net.sh make check -j"$jobs"
          # A refusal landing before connect() returns skips on the older probe
          # instead, leaving the settle this leg exists to guard unrun.
          cat tests/246_engine-connect-stop.log
          grep -q 'within 500 ms' tests/246_engine-connect-stop.log

      - name: Test on the network an rpm buildroot has
        timeout-minutes: 20
        run: |
          set -euo pipefail
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          tools/buildroot-net.sh make check -j"$jobs"
          # Only the widening half needs an address the namespace lacks, so a
          # run that never reached the loopback half proves nothing.
          cat tests/335_webhttrack-bind-loopback.log
          grep -q 'the default socket answers on 127.0.0.1' \
            tests/335_webhttrack-bind-loopback.log

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

  # The Ubuntu buildds run a development release every runner above is well behind.
  # That gap is what shipped 3.49.18 broken on every Ubuntu architecture but
  # riscv64, when 25.10 made uutils the default coreutils (#1042).
  ubuntu-devel:
    name: build (Ubuntu devel, uutils coreutils)
    runs-on: ubuntu-24.04
    container: ubuntu:devel
    timeout-minutes: 40
    steps:
      # Before checkout: the container has no git, so submodules would be lost.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev \
            git ca-certificates python3 procps

      - name: Assert the coreutils dispatch on argv[0]
        # The property #1042 broke on, not the version banner, which uutils has
        # already reworded once. Without it the job quietly becomes a slower copy
        # of the one above.
        run: |
          set -euo pipefail
          ln -s "$(command -v sleep)" /tmp/not-a-coreutil
          if /tmp/not-a-coreutil 0; then
            echo "::error::coreutils here take any argv[0]; this image no longer guards uutils" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure
          # A renamed dev package would disable a codec or TLS here, and the tests
          # that cover them would SKIP rather than fail.
          grep -q "define HTS_USEBROTLI 1" config.h
          grep -q "define HTS_USEZSTD 1" config.h
          grep -q "define HTS_USEOPENSSL 1" config.h

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        timeout-minutes: 25
        run: |
          set -euo pipefail
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

  # Portability: build and test on macOS (Darwin/clang) on a native runner --
  # no VM. The tree has no __APPLE__ branches, so Darwin exercises the
  # generic-Unix path on a second libc and kernel. openssl@4 is what the
  # homebrew-core formula depends on, so it is what brew installs run; the DMG
  # ships openssl@3, which macos-app still builds. Keg-only, hence the paths.
  macos:
    name: build (macOS arm64, clang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install autoconf automake libtool autoconf-archive brotli zstd

      - name: Configure
        run: |
          set -euo pipefail
          ssl="$(brew --prefix openssl@4)"
          brewp="$(brew --prefix)"
          autoreconf -fi
          ./configure CPPFLAGS="-I${ssl}/include -I${brewp}/include" \
            LDFLAGS="-L${ssl}/lib -L${brewp}/lib"
          grep -q "define HTS_USEBROTLI 1" config.h
          grep -q "define HTS_USEZSTD 1" config.h
          # brew --prefix answers for a formula it has not installed, so a
          # renamed or missing bottle would leave every TLS test skipping.
          grep -q "define HTS_USEOPENSSL 1" config.h

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Add loopback aliases (macOS lacks 127.0.0.2/.3)
        # 19_local-connect-fallback needs the dead 127.0.0.2/.3 to refuse
        # instantly like Linux; alias them onto lo0 so they don't stall to timeout.
        run: |
          set -euo pipefail
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up

      - name: Test
        timeout-minutes: 20
        run: |
          jobs=$(( $(sysctl -n hw.ncpu) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

  # Runtime smoke of the WebHTTrack launcher on macOS: it carries a Darwin-only
  # browser path (open -W) and nothing else exercises htsserver. Install into a
  # temp prefix, then check webhttrack brings up htsserver and serves the UI.
  webhttrack-macos:
    name: webhttrack smoke (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install autoconf automake libtool autoconf-archive brotli zstd

      - name: Build and install into a temp prefix
        run: |
          set -euo pipefail
          ssl="$(brew --prefix openssl@4)"
          brewp="$(brew --prefix)"
          autoreconf -fi
          ./configure CPPFLAGS="-I${ssl}/include -I${brewp}/include" \
            LDFLAGS="-L${ssl}/lib -L${brewp}/lib" \
            --prefix="$RUNNER_TEMP/inst"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Smoke-test webhttrack
        run: bash tests/webhttrack-smoke.sh "$RUNNER_TEMP/inst"

  # Same smoke on the platform that ships webhttrack as a package: the install layout
  # it asserts (a relative data symlink, #885) is what Debian consumes, and the macOS
  # job alone left that untested on Linux.
  webhttrack-linux:
    name: webhttrack smoke (Linux x86-64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - name: Build and install into a temp prefix
        run: |
          set -euo pipefail
          ./bootstrap
          ./configure --prefix="$RUNNER_TEMP/inst"
          make -j"$(nproc)"
          make install

      - name: Smoke-test webhttrack
        run: bash tests/webhttrack-smoke.sh "$RUNNER_TEMP/inst"

  # The macOS app bundle (#886): assemble it, then prove it still works after being
  # moved, which is the only thing a .app has to survive that a prefix install does not.
  macos-app:
    name: macOS app bundle (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install autoconf automake libtool autoconf-archive brotli zstd

      # --disable-shared keeps libhttrack inside the binaries, so the bundle carries no
      # absolute dylib path back to the staging prefix.
      - name: Build and install into a temp prefix
        run: |
          set -euo pipefail
          # openssl@3, matching macos-release.yml: this job is the release path
          # minus Apple, so it has to bundle what the signed DMG bundles.
          ssl="$(brew --prefix openssl@3)"
          brewp="$(brew --prefix)"
          ./bootstrap
          ./configure CPPFLAGS="-I${ssl}/include -I${brewp}/include" \
            LDFLAGS="-L${ssl}/lib -L${brewp}/lib" \
            --prefix="$RUNNER_TEMP/inst" --disable-shared
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Assemble HTTrack.app
        run: |
          set -euo pipefail
          make macos-app APP_FLAGS="--prefix $RUNNER_TEMP/inst --out $RUNNER_TEMP"
          plutil -lint "$RUNNER_TEMP/HTTrack.app/Contents/Info.plist"

      - name: Run it through the bundle stub
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/HTTrack.app"
          bash tests/webhttrack-smoke.sh "$app/Contents/Resources" "$app/Contents/MacOS/HTTrack"

      - name: Run it again after moving it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moved"
          mv "$RUNNER_TEMP/HTTrack.app" "$RUNNER_TEMP/moved/"
          rm -rf "$RUNNER_TEMP/inst"
          app="$RUNNER_TEMP/moved/HTTrack.app"
          bash tests/webhttrack-smoke.sh "$app/Contents/Resources" "$app/Contents/MacOS/HTTrack"

      # The load-command check cannot fail while the loader can still reach Homebrew (#901).
      - name: Run it with Homebrew's libraries out of reach
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/moved/HTTrack.app"
          # Without this the hiding below proves nothing: an empty Frameworks passes it.
          ls "$app/Contents/Frameworks"/libssl.*.dylib >/dev/null
          # The kegs, not just the opt symlinks: a source build records the Cellar path.
          hidden=""
          for keg in openssl@3 brotli zstd; do
            for d in "$(brew --prefix)/opt/$keg" "$(brew --prefix)/Cellar/$keg"; do
              if [ -e "$d" ]; then sudo mv "$d" "$d.hidden"; hidden="$hidden $d"; fi
            done
          done
          trap 'for d in $hidden; do sudo mv "$d.hidden" "$d"; done' EXIT
          test -n "$hidden"
          bash tests/webhttrack-smoke.sh "$app/Contents/Resources" "$app/Contents/MacOS/HTTrack"

      # The release path (macos-release.yml) minus Apple, so a bundle that cannot be
      # signed or packed fails on the PR rather than on release day.
      - name: Sign and pack the bundle, ad hoc
        run: |
          set -euo pipefail
          bash tools/macos-release.sh --app "$RUNNER_TEMP/moved/HTTrack.app" \
            --identity - --skip-notarize
          ls "$RUNNER_TEMP/moved"/HTTrack-*-macos-*.dmg >/dev/null

      # --label names the download for a product channel. The bundle inside keeps the
      # engine's version, which the step above already asserted against the binary.
      - name: Pack again under a channel label
        run: |
          set -euo pipefail
          bash tools/macos-release.sh --app "$RUNNER_TEMP/moved/HTTrack.app" \
            --identity - --skip-notarize --label 3.50-beta-0
          ls "$RUNNER_TEMP/moved"/HTTrack-3.50-beta-0-macos-*.dmg >/dev/null
          # Refused before anything is signed, so a typo costs a second, not a submission.
          ! bash tools/macos-release.sh --app "$RUNNER_TEMP/moved/HTTrack.app" \
            --identity - --skip-notarize --label 'a b/c'

  # Portability/hardening: 32-bit (i386) build on the x86-64 runner via multilib
  # -- no extra hardware. Exercises the 32-bit size_t/pointer ABI, where size
  # and bounds math can truncate or wrap in ways 64-bit never reveals (the axis
  # the overflow-safe bounds work targets). --build (not --host) keeps configure
  # out of cross mode, so the i386 binary still runs the test suite here.
  linux-i386:
    name: build (linux i386, gcc -m32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies (multilib + 32-bit libs)
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib autoconf automake libtool \
            autoconf-archive zlib1g-dev:i386 libssl-dev:i386 \
            libbrotli-dev:i386 libzstd-dev:i386

      - name: Configure
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure --build=i686-pc-linux-gnu CC="gcc -m32"

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        timeout-minutes: 20
        run: |
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

  # Memory safety: build and run the suite under AddressSanitizer +
  # UndefinedBehaviorSanitizer. The offline engine self-tests drive the parsers
  # that chew on untrusted crawled input (charset, mime, HTML, entities, IDNA,
  # filters, cache) straight through the sanitizers, so a buffer overrun,
  # use-after-free, or signed overflow there fails the build instead of slipping
  # past a plain -O2 build. gcc's runtimes; one job is enough (the bug class is
  # arch-independent and the matrix already covers compile portability).
  sanitize:
    name: sanitize (ASan+UBSan, gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - name: Configure (sanitized)
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure CC=gcc \
            CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g -O1 -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined"

      - name: Build
        run: make -j"$(nproc)"

      - name: Test (sanitized)
        # Leaks at exit are out of scope (the CLI frees little on the way out);
        # we want memory-safety errors, so turn leak detection off and make every
        # other finding abort the run.
        #
        # Poison fresh allocations with 0xCA and freed blocks with 0xCB (decimal
        # 202/203) so memory never reads back as accidental zeros: a missing-NUL
        # fread buffer then runs strlen off into the redzone instead of stopping
        # at a lucky zero. Distinct bytes tell the two apart in a dump (0xCA =
        # uninitialized, 0xCB = use-after-free). ASan caps its malloc fill at 4096
        # bytes by default, so max_malloc_fill_size lifts it to cover large cache
        # buffers; free_fill flags use-after-free reads.
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1:strict_string_checks=1:malloc_fill_byte=202:max_malloc_fill_size=2147483647:free_fill_byte=203:max_free_fill_size=2147483647:log_path=${{ github.workspace }}/sanitizer-logs/asan
          # No log_path here: gcc's UBSan ignores it and writes to stderr, which
          # most tests redirect away; the harness keeps a copy under the directory
          # below.
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          HTTRACK_STDERR_CAPTURE_DIR: ${{ github.workspace }}/sanitizer-stderr
        timeout-minutes: 20
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sanitizer-logs" "$GITHUB_WORKSPACE/sanitizer-stderr"
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

      - name: Collect sanitizer findings
        if: always()
        run: |
          set -euo pipefail
          sh tools/ci-sanitizer-report.sh -s "$GITHUB_WORKSPACE/sanitizer-stderr" \
            "$GITHUB_WORKSPACE/sanitizer-logs" tests

      - name: Upload the sanitizer and per-test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitize-logs
          path: |
            sanitizer-logs/
            sanitizer-stderr/
            tests/*.log
          if-no-files-found: ignore

  # MemorySanitizer catches reads of uninitialized memory (#143's stack-garbage
  # size filter) that ASan/UBSan miss. It flags any byte an uninstrumented lib
  # wrote, so the job stays in our own code: offline self-tests only, no openssl
  # (--disable-https), no zlib cache tests, static (the runtime is not in .so's).
  msan:
    name: msan (MemorySanitizer, clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential clang autoconf automake libtool autoconf-archive \
            zlib1g-dev

      - name: Configure (MSan, static, no https)
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure CC=clang \
            CFLAGS="-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-sanitize-recover=all -g -O1 -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=memory" \
            --disable-https --disable-shared --enable-static

      - name: Build
        run: make -j"$(nproc)"

      - name: Test (offline self-tests under MSan)
        env:
          MSAN_OPTIONS: abort_on_error=1:halt_on_error=1:log_path=${{ github.workspace }}/sanitizer-logs/msan
          HTTRACK_STDERR_CAPTURE_DIR: ${{ github.workspace }}/sanitizer-stderr
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/sanitizer-logs" "$GITHUB_WORKSPACE/sanitizer-stderr"
          # 01_engine-* only; zlib-dependent self-tests are named 01_zlib-* and
          # skipped here (uninstrumented libz floods MSan with false positives).
          tests="$(cd tests && ls 01_engine-*.test | tr '\n' ' ')"
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs" TESTS="$tests"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

      - name: Collect sanitizer findings
        if: always()
        run: |
          set -euo pipefail
          sh tools/ci-sanitizer-report.sh -s "$GITHUB_WORKSPACE/sanitizer-stderr" \
            "$GITHUB_WORKSPACE/sanitizer-logs" tests

      - name: Upload the sanitizer and per-test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msan-logs
          path: |
            sanitizer-logs/
            sanitizer-stderr/
            tests/*.log
          if-no-files-found: ignore

  # libFuzzer smoke: build the fuzz/ harnesses over the pure hostile-input
  # parsers and replay each seed corpus under ASan+UBSan+LeakSanitizer. Replay
  # (not open-ended mutation) keeps CI deterministic -- it can't hit strjoker's
  # catastrophic backtracking -- and pins the regression seeds for the bugs the
  # fuzzers found. Deep discovery is a maintainer / OSS-Fuzz activity.
  fuzz:
    name: fuzz (libFuzzer corpus replay, clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential clang autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - name: Configure (fuzzers, static)
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure CC=clang \
            CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g -O1 -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined" \
            --enable-fuzzers --disable-shared

      - name: Build
        run: make -j"$(nproc)"

      - name: Replay corpora
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: bash fuzz/run-fuzzers.sh fuzz check

  # Catches #1030: the job above links ASan, whose runtime already defines the
  # sancov hooks the instrumentation calls, hiding a program left without one.
  fuzz-no-sanitizer:
    name: build (fuzzers, no sanitizer runtime, clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential clang autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - name: Configure (fuzzers, static)
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure CC=clang --enable-fuzzers --disable-shared

      - name: Build
        run: make -j"$(nproc)"

  # Optional-dependency build: compile and test with HTTPS/OpenSSL disabled --
  # the configuration users on minimal systems build, and one libssl is not even
  # installed here so configure cannot silently re-enable it. The matrix above
  # always has libssl, so the #if HTS_USEOPENSSL branches would otherwise never
  # be compiled and could rot unnoticed.
  no-ssl:
    name: build (no openssl, --disable-https)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies (no libssl)
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive zlib1g-dev

      - name: Configure (https disabled)
        run: |
          set -euo pipefail
          autoreconf -fi
          # The only leg with the example plugins off: 225 and 376 lose that direction if this job goes.
          ./configure --disable-https --disable-example-libs

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        timeout-minutes: 20
        run: |
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

  # --disable-auto-features is what a distribution recipe passes, and nothing
  # else builds a tree with an optional feature off. The second configure turns
  # off iconv alone: with every feature sharing one value, a test reading the
  # wrong one still agrees with the right one.
  auto-features:
    name: build (--disable-auto-features, then iconv alone off)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev pkg-config

      - name: Bootstrap
        run: autoreconf -fi

      - name: Every optional feature off
        run: |
          set -euo pipefail
          mkdir -p ../bld-off
          cd ../bld-off
          bash "$GITHUB_WORKSPACE/configure" --disable-auto-features
          make -j"$(nproc)"
          # The libraries are installed above, so "off" here is the switch's
          # doing and not the runner's.
          got=$(./src/httrack -#test=features | tr '\n' ' ')
          echo "features: $got"
          case " $got " in
          *" brotli 0 "*" iconv 0 "*) ;;
          *) echo "expected every feature off, got: $got"; exit 1 ;;
          esac

      - name: Test, every optional feature off
        timeout-minutes: 20
        run: |
          set -euo pipefail
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make -C ../bld-off check -j"$jobs" ||
            { cat ../bld-off/tests/test-suite.log 2>/dev/null; exit 1; }

      - name: iconv alone off
        run: |
          set -euo pipefail
          mkdir -p ../bld-mixed
          cd ../bld-mixed
          bash "$GITHUB_WORKSPACE/configure" --without-iconv
          make -j"$(nproc)"
          got=$(./src/httrack -#test=features | tr '\n' ' ')
          echo "features: $got"
          # The point of this configuration: the four values are not all equal.
          case " $got " in
          *" brotli 1 "*" iconv 0 "*) ;;
          *) echo "expected brotli on and iconv off, got: $got"; exit 1 ;;
          esac

      - name: Test, iconv alone off
        timeout-minutes: 20
        run: |
          set -euo pipefail
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make -C ../bld-mixed check -j"$jobs" ||
            { cat ../bld-mixed/tests/test-suite.log 2>/dev/null; exit 1; }

  # The cell of #1139: a libc exporting getrandom() without shipping
  # <sys/random.h>. Nothing else reaches it, and it is a hard build break when
  # the call is not gated on the header. It also runs the /dev/urandom fallback.
  no-getrandom:
    name: build (getrandom header hidden)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - name: Configure (sys/random.h hidden from configure)
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure ac_cv_header_sys_random_h=no
          # A libc without getrandom() at all would pass this job vacuously.
          grep -q "define HAVE_GETRANDOM 1" config.h
          ! grep -q "define HAVE_SYS_RANDOM_H" config.h

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        timeout-minutes: 20
        run: |
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

  # Termux's cell: bionic before API 28 links backtrace() (libandroid-execinfo)
  # but ships no <spawn.h>, so the symbolizer the backtrace block pulls in is a
  # hard build break there. The suite also runs with frame naming compiled out.
  no-spawn:
    name: build (spawn.h hidden)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - name: Configure (spawn.h hidden from configure)
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure ac_cv_header_spawn_h=no
          # A build with no backtrace() at all would pass this job vacuously.
          grep -q "define HAVE_BACKTRACE 1" config.h
          ! grep -q "define HAVE_SPAWN_H" config.h

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        timeout-minutes: 20
        run: |
          jobs=$(( $(nproc) * 2 )); [ "$jobs" -le 16 ] || jobs=16
          make check -j"$jobs"

      - name: Print the test log on failure
        if: failure()
        run: cat tests/test-suite.log 2>/dev/null || true

  # OpenSSL 4.0 removes the API 3.x deprecated. Building with that set hidden
  # keeps the engine ready for it: a deprecated call fails here rather than the
  # day a distro moves. Compile-only, since the headers are what is under test.
  openssl-no-deprecated:
    name: build (OpenSSL, no deprecated API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - name: Configure (deprecated OpenSSL API hidden)
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure CPPFLAGS=-DOPENSSL_NO_DEPRECATED
          # A build with https off would pass this job vacuously.
          grep -q "define HTS_USEOPENSSL 1" config.h

      - name: Build
        run: make -j"$(nproc)"

  # Validate the Debian packaging via the same script maintainers release with.
  # One amd64/gcc run is enough: packaging (control/rules/manifest/lintian/quilt
  # source build) is arch- and compiler-independent, and the build matrix above
  # already covers compile portability. mkdeb.sh runs lintian as an explicit gate
  # (debuild does not propagate lintian's exit) with --fail-on=error,warning.
  deb:
    name: deb package (lintian)
    runs-on: ubuntu-24.04
    # Build and gate inside Debian sid, the upload target. A Debian dpkg-deb
    # produces archive-legal xz members (an Ubuntu host defaults to zstd, which
    # the archive's lintian rejects), and sid's lintian carries the same
    # data-driven checks (embedded-lib fingerprints and the like) the buildds and
    # UDD apply -- so issues surface here instead of after upload.
    container: debian:sid
    steps:
      - name: Install packaging toolchain
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev \
            debhelper devscripts lintian fakeroot

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # --unsigned: CI has no GPG key (also skips the release sig/checksums).
      # mkdeb builds every package then runs the lintian gate (--fail-on=error,
      # warning); debuild runs the packaged test pass.
      #
      # DEB_BUILD_OPTIONS trims work CI does not need (release builds via
      # mkdeb.sh are untouched): noautodbgsym drops the -dbgsym packages whose
      # LTO payloads are slow to compress and that CI never ships; parallel uses
      # every core.
      - name: Build and lint Debian packages
        run: |
          set -euo pipefail
          # The workspace volume is owned by the host runner uid, but the
          # container runs as root, so mkdeb's git calls (superproject and the
          # coucal submodule) trip "dubious ownership"; mark them all safe.
          git config --global --add safe.directory "*"
          export DEB_BUILD_OPTIONS="noautodbgsym parallel=$(nproc)"
          bash tools/mkdeb.sh --unsigned --no-release-artifacts

  # Release-tarball integrity: `make distcheck` rolls the dist tarball, then
  # configures, builds and tests it out-of-tree from a read-only source tree and
  # checks nothing is left behind. Catches a file referenced in *_SOURCES or
  # EXTRA_DIST but missing from the tarball -- the same "ships broken to users"
  # class as a stale committed Makefile.in.
  distcheck:
    name: distcheck (release tarball)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - name: distcheck
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure
          make -j"$(nproc)" distcheck

  dco:
    name: DCO sign-off
    # Only checkable on a PR, where we have the base..head commit range.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit must be signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          # --no-merges: merge commits are GitHub-generated and carry no sign-off.
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if [ -z "$(git log -1 --format='%(trailers:key=Signed-off-by)' "$sha")" ]; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo
            echo "Sign commits with 'git commit -s'; fix a branch with 'git rebase --signoff $BASE'."
            echo "See CONTRIBUTING.md (Developer Certificate of Origin)."
            exit 1
          fi

  lint:
    # The name is a required status check on master; renaming it blocks every PR.
    name: lint (shellcheck, shfmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          # noble ships shfmt 3.8.0 (universe), matching the pinned local dev
          # version; use it rather than fetching a release binary from github.com.
          sudo apt-get install -y --no-install-recommends shellcheck shfmt appstream \
            appstream-util
          # Pinned to the local dev versions: black's stable style moves across
          # majors, so the runner image's build would reformat on its own schedule.
          pip install --quiet black==25.1.0 flake8==7.1.1
          shfmt --version
          appstreamcli --version
          black --version
          flake8 --version

      # Read the list rather than hand-keeping one: a script added outside the
      # old globs then gets checked without anyone widening them.
      - name: List the tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -t sh < <(
            git ls-files '*.sh' '*.test'
            # The rest are named by their shebang, not by an extension.
            git ls-files | while IFS= read -r f; do
              case "$f" in *.sh | *.test) continue ;; esac
              IFS= read -r line <"$f" 2>/dev/null || continue
              case "$line" in
              '#!'*/sh | '#!'*/bash | '#!'*/sh\ * | '#!'*/bash\ * | '#!'*env*\ sh | '#!'*env*\ bash)
                printf '%s\n' "$f"
                ;;
              esac
            done
          )
          # shellcheck given no paths exits 0, checking nothing. A non-zero
          # count is too weak a floor: the shebang scan can drop almost every
          # file and still pass one, so pin the half that cannot shrink and
          # name the extension-less scripts the scan must reach.
          test "${#sh[@]}" -ge "$(git ls-files '*.sh' '*.test' | wc -l)"
          for must in bootstrap .githooks/pre-commit src/webhttrack.in; do
            case " ${sh[*]} " in
            *" $must "*) ;;
            *) echo "the shebang scan no longer finds $must" >&2; exit 1 ;;
            esac
          done
          echo "${#sh[@]} tracked shell scripts"
          echo "SHELL_SCRIPTS=${sh[*]}" >> "$GITHUB_ENV"

      - name: shellcheck
        run: shellcheck $SHELL_SCRIPTS

      - name: shfmt
        run: shfmt -d -i 4 $SHELL_SCRIPTS

      # Read the list rather than hand-keeping one: a .py added in a new
      # directory then gets checked without anyone widening a glob.
      - name: List the tracked Python files
        run: |
          set -euo pipefail
          mapfile -t py < <(git ls-files '*.py')
          test "${#py[@]}" -gt 0  # flake8 given no paths exits 0, checking nothing
          echo "${#py[@]} tracked Python files"
          echo "PYTHON_FILES=${py[*]}" >> "$GITHUB_ENV"

      - name: black
        run: black --check --diff $PYTHON_FILES

      - name: flake8
        run: flake8 $PYTHON_FILES

      # A misnamed test falls outside the glob "make check" runs, so it goes
      # missing without failing anything.
      - name: test file names
        run: bash tests/check-test-names.sh

      # The corpus glob is what ships the vectors in a tarball, and it has no
      # oracle of its own: three were missing for exactly that reason.
      - name: fuzz corpus list
        run: bash fuzz/check-corpus-list.sh

      # A macro borrowed from another header builds only where that header is
      # present (#1481).
      - name: standard includes
        run: python3 tools/check-includes.py

      # MSBuild rejects a malformed .vcxproj with a bare MSB4025 and no build, so
      # catch it here in seconds rather than on a Windows runner minutes in.
      - name: XML well-formedness (MSBuild project files)
        run: |
          set -euo pipefail
          for f in src/*.vcxproj; do
            python3 -c "import sys,xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$f"
            echo "ok $f"
          done

      # A software centre quietly ignores a metainfo it cannot parse. Errors and
      # warnings fail; --no-net so the gate is on the file, not httrack.com's uptime.
      - name: AppStream metainfo validation
        run: |
          set -euo pipefail
          appstreamcli validate --no-net --explain \
            html/server/div/com.httrack.WebHTTrack.metainfo.xml
          appstream-util validate-relax --nonet \
            html/server/div/com.httrack.WebHTTrack.metainfo.xml

  # Check clang-format on CHANGED LINES ONLY. The engine predates clang-format
  # (it was shaped by an old Visual Studio formatter) and does not round-trip,
  # so we never reformat the whole tree -- only the lines a PR touches.
  format:
    name: format (clang-format-19, changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format 19 (pinned, from apt.llvm.org)
        run: |
          set -euo pipefail
          # ubuntu-24.04's native clang-format is 18; pin 19 to match local dev.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list >/dev/null
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends clang-format-19
          # The clang-format-19 package ships the git-clang-format driver;
          # expose it unsuffixed so "git clang-format" finds it.
          sudo ln -sf /usr/bin/git-clang-format-19 /usr/local/bin/git-clang-format
          clang-format-19 --version

      - name: Check formatting of changed lines
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          # Merge base, not the branch tip: master moves during a run, and a
          # tip-relative diff blames its new C on this PR.
          if ! base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"; then
            echo "::error::no merge base with origin/${{ github.base_ref }}; cannot scope the check."
            exit 1
          fi
          set +e
          diff="$(git clang-format --binary clang-format-19 --style=file \
                    --diff --extensions c,h "$base")"
          rc=$?
          set -e
          # Classify by output, not exit code: a non-empty diff means "not
          # clean" (git-clang-format may exit 0 or 1 on a diff). A nonzero exit
          # with clean output is a real checker error.
          case "$diff" in
            "" | "no modified files to format" | *"did not modify any files"*)
              if [ "$rc" -ne 0 ]; then
                echo "::error::git clang-format failed (exit $rc): checker error."
                exit 1
              fi
              echo "Formatting OK: changed C lines are clang-format-clean." ;;
            *)
              echo "$diff"
              echo "::error::Changed C lines are not clang-format-clean."
              echo "Fix locally with: git clang-format --binary clang-format-19 $base"
              exit 1 ;;
          esac

  docs:
    name: documentation (chrome in sync, links resolve)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The pages carry their navigation as real markup, because they are read from
      # disk as often as over http and file:// has no includes. Regenerating has to
      # be a no-op, or a page has drifted from tools/doc-chrome.py.
      - name: Shared chrome is in sync
        run: python3 tools/doc-chrome.py --check

      - name: Relative links and anchors resolve
        run: python3 tools/doc-links.py html

  man-page-sync:
    name: man page / html in sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # html/httrack.man.html is groff-rendered from man/httrack.1 and committed.
      # Rendering needs the full groff html device, so CI can't regenerate it;
      # instead require the two to move together: a PR that touches httrack.1
      # must also touch the html, catching the "regenerated roff, forgot html".
      - name: httrack.1 changes must include html/httrack.man.html
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          # Three dots: merge-base scoped, so commits landing on master mid-run
          # are not counted as this PR's.
          changed="$(git diff --name-only "$base"...HEAD)"
          has() { printf '%s\n' "$changed" | grep -qx "$1"; }
          if has man/httrack.1 && ! has html/httrack.man.html; then
            echo "::error::man/httrack.1 changed but html/httrack.man.html did not."
            echo "Regenerate it with: make -C man regen-man-html (needs the full groff package)."
            exit 1
          fi
          echo "man/html sync OK."
