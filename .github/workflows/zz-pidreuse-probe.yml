# Scratch probe: does taskkill /F /T follow a recorded parent PID whose owner is
# long dead? Not part of the build gate; branch-scoped, delete when answered.
name: zz pid-reuse probe

on:
  push:
    branches: [zz-pidreuse-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          $sum = $env:GITHUB_STEP_SUMMARY

          function Say([string]$m) {
            Write-Host $m
            if ($sum) { try { Add-Content -LiteralPath $sum -Value $m -ErrorAction SilentlyContinue } catch { } }
          }

          Say "# PID-reuse probe on $env:COMPUTERNAME  $(Get-Date -Format o)"
          Say ""
          Say '```'

          # ---------------------------------------------------------------
          # Part 1: is the hazard even present?
          # ---------------------------------------------------------------
          Say "== PART 1: recorded-parent state of the runner's own processes =="

          $snap = @(Get-CimInstance Win32_Process)
          $byPid = @{}
          foreach ($p in $snap) { $byPid[[int]$p.ProcessId] = $p }
          Say ("snapshot: {0} live processes" -f $snap.Count)

          function Stamp($d) { if ($null -eq $d) { return '?' } else { return ([datetime]$d).ToString('HH:mm:ss.fff') } }

          function Classify([int]$q) {
            $c = $byPid[$q]
            if ($null -eq $c) { return 'NOPROC' }
            $par = $byPid[[int]$c.ParentProcessId]
            if ($null -eq $par) { return 'DEAD-PARENT' }
            if ($null -eq $par.CreationDate -or $null -eq $c.CreationDate) { return 'OK' }
            if ($par.CreationDate -gt $c.CreationDate) { return 'RECYCLED-PARENT' }
            return 'OK'
          }

          function Chain([int]$q) {
            $out = @()
            $seen = @{}
            $cur = $q
            for ($i = 0; $i -lt 24; $i++) {
              $c = $byPid[$cur]
              if ($null -eq $c) { $out += ("{0}=<no such process>" -f $cur); break }
              $out += ("{0}/{1}@{2}" -f $c.ProcessId, $c.Name, (Stamp $c.CreationDate))
              if ($seen.ContainsKey($cur)) { $out += '<cycle>'; break }
              $seen[$cur] = $true
              $st = Classify $cur
              if ($st -ne 'OK') { $out += ("<<{0}>>" -f $st); break }
              $cur = [int]$c.ParentProcessId
              if ($cur -eq 0) { break }
            }
            return ($out -join ' <- ')
          }

          $interesting = @($snap | Where-Object {
            $_.Name -like 'Runner.*' -or $_.Name -like 'Agent.*' -or $_.Name -like 'hosted-*' -or
            $_.Name -eq 'bash.exe' -or $_.Name -eq 'pwsh.exe' -or
            $_.Name -eq 'powershell.exe' -or $_.Name -eq 'dotnet.exe' -or
            $_.Name -eq 'node.exe' -or $_.Name -eq 'cmd.exe' -or
            $_.Name -eq 'conhost.exe' -or $_.Name -eq 'sh.exe'
          } | Sort-Object Name, ProcessId)

          $armed = 0
          foreach ($p in $interesting) {
            $st = Classify ([int]$p.ProcessId)
            Say ("  {0,-24} pid={1,-7} ppid={2,-7} {3,-16} {4}" -f $p.Name, $p.ProcessId, $p.ParentProcessId, $st, (Chain ([int]$p.ProcessId)))
            if ($st -ne 'OK' -and ($p.Name -like 'Runner.*' -or $p.Name -like 'Agent.*' -or $p.Name -like 'hosted-*')) { $armed++ }
          }

          $dead = 0; $rec = 0; $ok = 0
          $boxOrphan = @{}
          foreach ($p in $snap) {
            $st = Classify ([int]$p.ProcessId)
            if ($st -eq 'DEAD-PARENT') {
              $dead++
              $k = [int]$p.ParentProcessId
              if (-not $boxOrphan.ContainsKey($k)) { $boxOrphan[$k] = @() }
              $boxOrphan[$k] += ("{0}/{1}" -f $p.ProcessId, $p.Name)
            } elseif ($st -eq 'RECYCLED-PARENT') { $rec++ } else { $ok++ }
          }
          Say ""
          Say ("box-wide: {0} processes, {1} with a DEAD recorded parent, {2} with a RECYCLED one, {3} sound" -f $snap.Count, $dead, $rec, $ok)
          foreach ($k in ($boxOrphan.Keys | Sort-Object)) {
            Say ("  dead ppid {0,-7} still claimed as parent by: {1}" -f $k, ($boxOrphan[$k] -join ', '))
          }
          Say ""
          if ($armed -gt 0) {
            Say "PART 1 VERDICT: HAZARD PRESENT - $armed runner-agent process(es) record a parent PID that is dead or already recycled."
          } elseif ($dead -gt 0) {
            Say "PART 1 VERDICT: no Runner.*/Agent.* process has a stale recorded parent, but $dead other live processes do."
          } else {
            Say "PART 1 VERDICT: NOT ARMED - every live process's recorded parent is alive and older."
          }
          Say ""

          # ---------------------------------------------------------------
          # Part 2. Run 1 found 0 collisions in 8095 spawns against 300 dead
          # orphan-parent PIDs, which is ~100x below chance -- so those PIDs were
          # not merely unlucky, they were unavailable. Four sets, freed at the
          # same instant, separate the candidate reasons:
          #   A  plain ping, killed, .NET handle disposed        (baseline: reuse works?)
          #   C  plain ping, killed, handle deliberately HELD    (does an open handle pin the PID?)
          #   D  cmd orphan-maker, child killed, handle disposed (is the construction sound?)
          #   B  cmd orphan-maker, child left ALIVE, disposed    (the real question)
          # ---------------------------------------------------------------
          Say "== PART 2: can a dead parent's PID be handed out again, and does taskkill /T follow it? =="

          function New-Ping {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = "$env:SystemRoot\System32\PING.EXE"
            $psi.Arguments = '-n 600 127.0.0.1'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            return [System.Diagnostics.Process]::Start($psi)
          }

          function New-Orphan {
            # cmd exits at once, leaving ping alive with cmd's now-free PID recorded as parent.
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = "$env:ComSpec"
            $psi.Arguments = '/c start /b ping -n 600 127.0.0.1 > NUL'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            return [System.Diagnostics.Process]::Start($psi)
          }

          function Get-Proc([int]$q) {
            return (Get-CimInstance Win32_Process -Filter "ProcessId = $q" -ErrorAction SilentlyContinue | Select-Object -First 1)
          }

          function New-Set { return (New-Object 'System.Collections.Generic.HashSet[int]') }

          # --- control: a tree kill of a LIVE parent must kill its child, or the probe is blind.
          Say ""
          Say "-- control: taskkill /F /T on a live cmd whose child ping is genuine"
          $ctlPsi = New-Object System.Diagnostics.ProcessStartInfo
          $ctlPsi.FileName = "$env:ComSpec"
          $ctlPsi.Arguments = '/c ping -n 600 127.0.0.1 > NUL'
          $ctlPsi.UseShellExecute = $false
          $ctlPsi.CreateNoWindow = $true
          $ctl = [System.Diagnostics.Process]::Start($ctlPsi)
          Start-Sleep -Milliseconds 1200
          $ctlKid = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($ctl.Id)")
          if ($ctlKid.Count -eq 0) {
            Say "  control INCONCLUSIVE: no child found under cmd $($ctl.Id)"
            try { $ctl.Kill() } catch { }
          } else {
            $kp = [int]$ctlKid[0].ProcessId
            Say ("  cmd {0} -> child {1}/{2}" -f $ctl.Id, $kp, $ctlKid[0].Name)
            $co = (& taskkill.exe /F /T /PID $ctl.Id 2>&1 | Out-String).Trim()
            Say ("  taskkill: " + ($co -replace "`r?`n", ' | '))
            Start-Sleep -Milliseconds 800
            $still = Get-Proc $kp
            Say ("  control result: child {0} {1}" -f $kp, $(if ($null -eq $still) { 'GONE - the probe can observe a tree kill' } else { 'STILL ALIVE - probe is blind, part 2 is inconclusive' }))
          }
          try { $ctl.Dispose() } catch { }

          $conBefore = @(Get-Process conhost -ErrorAction SilentlyContinue).Count

          # --- build the four sets.
          $NB = 300; $NA = 200; $NC = 200; $ND = 200
          Say ""
          Say "-- building sets: B=$NB orphan-makers with a live child, D=$ND orphan-makers with the child killed, A=$NA plain (handle disposed), C=$NC plain (handle held)"

          $bCmd = New-Object 'System.Collections.Generic.List[System.Diagnostics.Process]'
          for ($i = 0; $i -lt $NB; $i++) { try { $bCmd.Add((New-Orphan)) } catch { } }
          $dCmd = New-Object 'System.Collections.Generic.List[System.Diagnostics.Process]'
          for ($i = 0; $i -lt $ND; $i++) { try { $dCmd.Add((New-Orphan)) } catch { } }
          $aProc = New-Object 'System.Collections.Generic.List[System.Diagnostics.Process]'
          for ($i = 0; $i -lt $NA; $i++) { try { $aProc.Add((New-Ping)) } catch { } }
          $pinned = New-Object 'System.Collections.Generic.List[System.Diagnostics.Process]'
          for ($i = 0; $i -lt $NC; $i++) { try { $pinned.Add((New-Ping)) } catch { } }

          $bPid = New-Set; foreach ($p in $bCmd) { [void]$bPid.Add($p.Id) }
          $dPid = New-Set; foreach ($p in $dCmd) { [void]$dPid.Add($p.Id) }
          $aPid = New-Set; foreach ($p in $aProc) { [void]$aPid.Add($p.Id) }
          $cPid = New-Set; foreach ($p in $pinned) { [void]$cPid.Add($p.Id) }
          Say ("  distinct PIDs: B={0} D={1} A={2} C={3}" -f $bPid.Count, $dPid.Count, $aPid.Count, $cPid.Count)

          Start-Sleep -Seconds 2

          # Map the orphan pings back to the cmd that made them.
          $orphan = @{}
          $dKids = New-Object 'System.Collections.Generic.List[int]'
          $nB = 0
          foreach ($p in @(Get-CimInstance Win32_Process -Filter "Name = 'ping.exe'")) {
            $pp = [int]$p.ParentProcessId
            if ($bPid.Contains($pp)) {
              if (-not $orphan.ContainsKey($pp)) { $orphan[$pp] = @() }
              $orphan[$pp] += [pscustomobject]@{ Pid = [int]$p.ProcessId; Created = $p.CreationDate }
              $nB++
            } elseif ($dPid.Contains($pp)) {
              $dKids.Add([int]$p.ProcessId)
            }
          }
          Say ("  orphan pings found: {0} under {1} B-parents, {2} under D-parents" -f $nB, $orphan.Keys.Count, $dKids.Count)

          # Free everything at the same instant: dispose A/B/D handles, keep C's.
          foreach ($p in $bCmd) { try { $p.WaitForExit(2000) | Out-Null } catch { }; try { $p.Dispose() } catch { } }
          foreach ($p in $dCmd) { try { $p.WaitForExit(2000) | Out-Null } catch { }; try { $p.Dispose() } catch { } }
          foreach ($p in $aProc) { try { $p.Kill() } catch { } }
          foreach ($p in $pinned) { try { $p.Kill() } catch { } }
          Start-Sleep -Milliseconds 800
          foreach ($p in $aProc) { try { $p.Dispose() } catch { } }
          $aProc.Clear()
          $bCmd.Clear(); $dCmd.Clear()
          if ($dKids.Count -gt 0) { Stop-Process -Id $dKids.ToArray() -Force -ErrorAction SilentlyContinue }
          [GC]::Collect(); [GC]::WaitForPendingFinalizers(); [GC]::Collect()
          Start-Sleep -Seconds 2

          # Sanity: every set member must actually be gone from the process table.
          $liveNow = New-Set
          foreach ($p in @(Get-CimInstance Win32_Process)) { [void]$liveNow.Add([int]$p.ProcessId) }
          function CountLive($s) { $n = 0; foreach ($x in $s) { if ($liveNow.Contains($x)) { $n++ } }; return $n }
          Say ("  still live (must be 0): B={0} D={1} A={2} C={3}" -f (CountLive $bPid), (CountLive $dPid), (CountLive $aPid), (CountLive $cPid))
          $conAfter = @(Get-Process conhost -ErrorAction SilentlyContinue).Count
          Say ("  conhost.exe count: {0} before the sets, {1} after (a surviving console holds a handle on its creator)" -f $conBefore, $conAfter)
          $bAlive = 0
          foreach ($k in $orphan.Keys) { foreach ($o in $orphan[$k]) { if ($liveNow.Contains($o.Pid)) { $bAlive++ } } }
          Say ("  B orphan children still alive: {0} (these are what a stale-PPID tree kill would reap)" -f $bAlive)

          # --- hunt.
          $hitA = 0; $hitB = 0; $hitC = 0; $hitD = 0; $boxHits = 0
          $spawns = 0; $bTested = 0
          $distinct = New-Set
          $window = New-Object 'System.Collections.Generic.Queue[System.Diagnostics.Process]'
          $minPid = [int]::MaxValue; $maxPid = 0

          function Test-Hit([int]$np) {
            if ($script:aPid.Contains($np)) { $script:hitA++ }
            if ($script:cPid.Contains($np)) {
              $script:hitC++
              Say ("!! set C hit: PID $np came back although a .NET process handle on it is still open")
            }
            if ($script:dPid.Contains($np)) { $script:hitD++ }
            if ($script:boxOrphan.ContainsKey($np)) {
              $script:boxHits++
              Say ""
              Say ("!! REAL COLLISION: our spawn got PID $np, which live box process(es) still record as their parent: $($script:boxOrphan[$np] -join ', ')")
              Say "   (not tree-killing this one: it would reap a process we did not start)"
              Say ""
            }
            if (-not $script:bPid.Contains($np)) { return $false }

            $script:hitB++
            Say ""
            Say ("### SET B HIT #$($script:hitB): spawn #$($script:spawns) at t=$([int]$script:sw.Elapsed.TotalSeconds)s was given PID $np, a dead orphan-parent PID")
            $kids = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $np")
            foreach ($k in $kids) { Say ("   the process table calls this a child of $np : {0}/{1} created {2}" -f $k.ProcessId, $k.Name, $k.CreationDate) }
            $before = @()
            foreach ($o in $script:orphan[$np]) {
              $cur = Get-Proc $o.Pid
              $alive = ($null -ne $cur -and $cur.CreationDate -eq $o.Created)
              $before += [pscustomobject]@{ Pid = $o.Pid; Created = $o.Created; Alive = $alive }
              Say ("   orphan ping {0} alive-before={1}" -f $o.Pid, $alive)
            }
            if (($before | Where-Object { $_.Alive }).Count -eq 0) {
              Say "   no live orphan left under this PID, nothing to measure; skipping the taskkill"
              return $false
            }
            $script:bTested++
            Say ("   issuing: taskkill /F /T /PID $np")
            $out = (& taskkill.exe /F /T /PID $np 2>&1 | Out-String).Trim()
            Say ("   taskkill said: " + ($out -replace "`r?`n", ' | '))
            Start-Sleep -Milliseconds 1000
            $anyDied = $false
            foreach ($b in $before) {
              $cur = Get-Proc $b.Pid
              $alive = ($null -ne $cur -and $cur.CreationDate -eq $b.Created)
              if ($b.Alive -and -not $alive) { $anyDied = $true }
              Say ("   orphan ping {0}: before={1} after={2}" -f $b.Pid, $b.Alive, $alive)
            }
            if ($anyDied) {
              Say "   >>> THE TREE WALK FOLLOWED A STALE PPID: taskkill /T does not validate creation time. Mechanism confirmed."
            } else {
              Say "   >>> the orphan survived: taskkill /T did not follow the stale PPID."
            }
            Say ""
            return ($script:bTested -ge 3)
          }

          $sw = [Diagnostics.Stopwatch]::StartNew()
          Say ""
          Say "-- hunting: rolling window of 200 live spawns, 300s cap"
          $done = $false
          while (-not $done -and $sw.Elapsed.TotalSeconds -lt 300) {
            try { $np = (New-Ping) } catch { Start-Sleep -Milliseconds 50; continue }
            $window.Enqueue($np)
            $spawns++
            $id = $np.Id
            [void]$distinct.Add($id)
            if ($id -lt $minPid) { $minPid = $id }
            if ($id -gt $maxPid) { $maxPid = $id }
            $done = Test-Hit $id
            while ($window.Count -gt 200) {
              $old = $window.Dequeue()
              try { $old.Kill() } catch { }
              try { $old.Dispose() } catch { }
            }
            if (($spawns % 250) -eq 0) { Write-Host ("   ... spawn $spawns, distinct $($distinct.Count), A=$hitA B=$hitB C=$hitC D=$hitD, t=$([int]$sw.Elapsed.TotalSeconds)s") }
          }

          Say ""
          Say "== RESULT =="
          Say ("spawns {0}, distinct PIDs {1}, range {2}..{3}, {4:N0}s" -f $spawns, $distinct.Count, $minPid, $maxPid, $sw.Elapsed.TotalSeconds)
          Say ("hits by set (each set held ~200-300 freed PIDs):")
          Say ("  A  killed, handle disposed, no child : {0}" -f $hitA)
          Say ("  C  killed, handle still OPEN         : {0}" -f $hitC)
          Say ("  D  dead orphan-maker, child killed   : {0}" -f $hitD)
          Say ("  B  dead orphan-maker, child ALIVE    : {0}   <- the one the theory needs" -f $hitB)
          Say ("  collisions with a dead PPID recorded by a process we did NOT start: {0}" -f $boxHits)
          if ($hitA -eq 0) {
            Say "INTERPRETATION: even the baseline set never came back. The allocator did not recycle any PID we freed, so this run says nothing about B."
          } elseif ($hitB -gt 0) {
            Say "INTERPRETATION: a dead parent's PID IS handed out again while a live process still records it as its parent. See the SET B HIT block above for what taskkill /T then did."
          } elseif ($hitD -gt 0) {
            Say "INTERPRETATION: the orphan construction recycles fine once the child is dead (D), but the PID of a parent with a LIVE recorded child never came back (B=0). The PID stays reserved while a process records it, so a tree kill can never land on it."
          } else {
            Say "INTERPRETATION: A recycles but neither D nor B does: the orphan-maker construction itself pins the PID (a surviving console host holds a handle), so B is not a clean test."
          }
          Say '```'

          while ($window.Count -gt 0) { $o = $window.Dequeue(); try { $o.Kill() } catch { } }
          try { Get-Process ping -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue } catch { }
          Write-Host "probe done"
