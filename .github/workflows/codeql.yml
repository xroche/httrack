# CodeQL static analysis (C). The security-extended suite covers the classes
# this codebase actually fights: overflows, tainted-size allocs, format bugs.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly re-scan of master so new/updated queries land without a push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Upload findings to the repo's code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - uses: github/codeql-action/init@v4.37.7
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          # fopen's umask-controlled 0666 is intended for mirror/cache/log
          # output; the one credential file (cookies.txt) is kept 0600 on Unix.
          config: |
            # No paths-ignore: GitHub honours it only for a compiled language
            # it does not build, so an exclusion has to leave the build itself.
            # libtest (demo callbacks) and src/proxy are analysed on purpose.
            query-filters:
              - exclude:
                  id: cpp/world-writable-file-creation
              # Models auth-bypass-by-spoofing; httrack has no auth surface, its +/- crawl filter is a mirror boundary, not a security one.
              - exclude:
                  id: cpp/user-controlled-bypass

      # Manual build: CodeQL traces the compiler, so build exactly what ships.
      - name: Build
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure
          # Codec detection is auto: without the -dev packages the br and zstd
          # decoders drop out and CodeQL analyses code that does not ship.
          grep -q "define HTS_USEBROTLI 1" config.h
          grep -q "define HTS_USEZSTD 1" config.h
          make -j"$(nproc)"

      - uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:c-cpp"
