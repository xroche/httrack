# CodeQL static analysis (C). The security-extended suite covers the classes
# this codebase actually fights: overflows, tainted-size allocs, format bugs.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly re-scan, guarded below. The analyzer is pinned by the action tag,
    # so a query update arrives as a dependabot push and is scanned by it.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only the cron reaches here, and only to ask whether master moved since the
  # last one: CodeQL reads this tree and a pinned analyzer, nothing that drifts
  # on its own. The distro canaries watch a downstream recipe and must never
  # take this guard, since a quiet week is when that recipe moves.
  freshness:
    name: has the tree moved?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.guard.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        run: tools/scheduled-run-needed.sh --event "${{ github.event_name }}"

  analyze:
    name: analyze (c-cpp)
    needs: freshness
    # Skipped, failed or empty all mean the guard did not answer, and only a
    # spoken 'false' stops the scan. `!cancelled()` is what lets the analysis
    # run at all on a push or a pull request, where freshness never starts.
    if: ${{ !cancelled() && needs.freshness.outputs.needed != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Upload findings to the repo's code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          # fopen's umask-controlled 0666 is intended for mirror/cache/log
          # output; the one credential file (cookies.txt) is kept 0600 on Unix.
          config: |
            # No paths-ignore: GitHub honours it only for a compiled language
            # it does not build, so an exclusion has to leave the build itself.
            # libtest (demo callbacks) and src/proxy are analysed on purpose.
            query-filters:
              - exclude:
                  id: cpp/world-writable-file-creation
              # Models auth-bypass-by-spoofing; httrack has no auth surface, its +/- crawl filter is a mirror boundary, not a security one.
              - exclude:
                  id: cpp/user-controlled-bypass

      # Manual build: CodeQL traces the compiler, so build exactly what ships.
      - name: Build
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure
          # Codec detection is auto: without the -dev packages the br and zstd
          # decoders drop out and CodeQL analyses code that does not ship.
          grep -q "define HTS_USEBROTLI 1" config.h
          grep -q "define HTS_USEZSTD 1" config.h
          make -j"$(nproc)"

      - uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:c-cpp"
