# No runner is a Hurd, and the builds that broke there failed a TEST rather than
# the compile (#1775), so cross-arch.yml cannot see this class.
name: Hurd suite

on:
  # Also on a pull request touching the driver, so a bug in it surfaces here
  # rather than at the next weekly run.
  pull_request:
    paths:
      - "tools/hurd-vm.sh"
      - ".github/workflows/hurd-suite.yml"
  # Scheduled by tier2.yml, which owns every leg that builds our own source.
  workflow_call:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: hurd-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hurd:
    name: hurd suite (amd64, qemu)
    runs-on: ubuntu-24.04
    # Hurd is slow at I/O and the VM gets one processor, so the suite takes far
    # longer here than anywhere else, though still well under the 6h ceiling.
    timeout-minutes: 120
    steps:
      - name: Install qemu
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 socat
          # KVM or this runs under TCG, where the suite would outlast the job.
          # The node exists on the runner but belongs to a group the runner user
          # is not in, so testing for its presence is not testing for access.
          test -e /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
          sudo chmod 666 /dev/kvm
          if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
            echo "::error::/dev/kvm is present but not usable"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Keyed on the pinned image name, so a new pin fetches and an old one does
      # not. The tarball is 354 MB against a 10 GB repository budget.
      - name: Cache the image tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hurd/cache
          key: hurd-image-debian-hurd-amd64-20260314

      - name: Build and run the suite on Hurd
        run: bash tools/hurd-vm.sh

      - name: Collect the suite log and the console
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hurd-suite-log
          path: |
            ${{ runner.temp }}/hurd/out/test-suite.log
            ${{ runner.temp }}/hurd/console.log
            ${{ runner.temp }}/hurd/screen.ppm
          if-no-files-found: warn
