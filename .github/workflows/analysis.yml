# Two analyses no PR waits on: a bounds-trapping build of the suite and the
# clang static analyzer. tier2.yml runs them weekly, and a dispatch aims them
# at a branch.
name: Analysis

on:
  # Scheduled by tier2.yml, which owns every leg that builds our own source.
  workflow_call:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

# ci.yml and tier2.yml carry the same number for the legs they run themselves.
# A reusable workflow inherits no env from its caller.
env:
  CHECK_JOBS: 16

jobs:
  # An overflow inside one struct is invisible to ASan and to FORTIFY, and a
  # bounds check that traps turns it into a crash. No runtime library is linked,
  # so a trap here is a real out-of-bounds index, never noise.
  bounds-strict:
    name: build (gcc -fsanitize=bounds-strict, trapping)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BOUNDS_CFLAGS: -O2 -g -fsanitize=bounds-strict -fsanitize-trap=bounds-strict
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev

      # A compiler that dropped the check would leave the suite green for
      # nothing, so an index one past the end must trap first.
      - name: Prove the flags trap an in-struct overflow
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/probe.c" <<'EOF'
          struct s { char a[8]; int next; };
          int main(int argc, char **argv) {
            struct s v = { { 0 }, 1 };
            (void) argv;
            v.a[argc + 7] = 'X';
            return v.next == 0;
          }
          EOF
          # shellcheck disable=SC2086 # a flag list, and the splitting is the point
          gcc $BOUNDS_CFLAGS -o "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe.c"
          st=0
          "$RUNNER_TEMP/probe" || st=$?
          if test "$st" -le 128 || test "$(kill -l "$st")" != ILL; then
            echo "::error::the probe exited $st instead of trapping"
            exit 1
          fi

      - name: Configure
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure CC=gcc CFLAGS="$BOUNDS_CFLAGS"
          grep -q -- '-fsanitize-trap=bounds-strict' src/Makefile

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        timeout-minutes: 25
        run: |
          set -euo pipefail
          make check -j"$CHECK_JOBS"

      # A test that tolerates a failing httrack would still pass through a
      # trap, but bash names the signal in the test's log.
      - name: Look for a trap a passing test absorbed
        if: always()
        run: |
          set -euo pipefail
          if grep -l 'Illegal instruction' tests/*.log; then
            echo "::error::a test binary trapped on an out-of-bounds index"
            exit 1
          fi

      - name: Print the test log on failure
        if: failure()
        run: sh tools/ci-test-log.sh

  # The analyzer still reports a handful of false positives, so findings do not
  # fail the job. The report is the artifact to read.
  scan-build:
    name: clang static analyzer (scan-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true  # a third-party source in the runner image can 403 (#1097)
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            zlib1g-dev libssl-dev libbrotli-dev libzstd-dev clang-tools

      # --disable-shared, because libtool otherwise compiles and analyzes
      # every file twice.
      - name: Configure
        run: |
          set -euo pipefail
          autoreconf -fi
          scan-build --version || true
          scan-build ./configure --disable-shared

      # coucal is a submodule with its own upstream.
      - name: Analyze
        run: |
          set -euo pipefail
          scan-build -o "$RUNNER_TEMP/scan" --exclude "$GITHUB_WORKSPACE/src/coucal" \
            make -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/scan.log"
          # A build that never reached the analyzer also ends without findings.
          summary=$(grep -E '^scan-build: ([0-9]+ bugs? found|No bugs found)' "$RUNNER_TEMP/scan.log" || true)
          test -n "$summary" || { echo "::error::scan-build printed no verdict"; exit 1; }
          echo "$summary" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the analyzer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-build-report
          path: ${{ runner.temp }}/scan/
          if-no-files-found: ignore
