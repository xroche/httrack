# This checks fifteen distributions' recipes against our tree. It blocks
# nothing, because a finding is usually theirs to fix.
name: distro packaging recipe canary

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: check the Gentoo, FreeBSD, OpenBSD and Termux recipes
    # Scheduled workflows run per-fork independently; skip anywhere but upstream.
    if: github.repository == 'xroche/httrack'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check the live recipes
        run: tools/downstream-drift.sh
