# Fifteen distributions carry recipes that assume things about our tree: a
# patch's context, a path a sed rewrites, a string an ebuild greps for. Without
# this, a packager finds a broken one at the next version bump. A finding is
# usually theirs to fix, so it blocks nothing.
name: distro packaging recipe canary

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: check the Gentoo, FreeBSD, OpenBSD and Termux recipes
    # Scheduled workflows run per-fork independently; skip anywhere but upstream.
    if: github.repository == 'xroche/httrack'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check the live recipes
        run: tools/downstream-drift.sh
